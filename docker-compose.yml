services:
  deid:
    build: .
    image: ct-deid:latest
    container_name: ct-deid
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      DEID_WORKERS: "2"              # 并行批次数:两批可并行,慢打包不阻塞另一批
      DEID_CLEANUP_INTERVAL: "5"     # 后台补清节拍(秒):删除失败按此频率自动重试
      DEID_FAULT_INJECTION: "0"      # 仅本地演示用,生产保持 0
    volumes:
      - deid-data:/data   # 数据卷:SQLite 映射库(含清理清单) + 结果包 + 患者代号密钥
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  deid-data:
